services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: gotstat
      POSTGRES_USER: gotstat
      POSTGRES_PASSWORD: gotstat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gotstat -d gotstat']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
